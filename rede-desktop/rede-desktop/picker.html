<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Escolha o que compartilhar</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif;
    background: #1e1f22;
    color: #f2f3f5;
    padding: 16px;
    -webkit-user-select: none;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  #grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-height: 340px;
    overflow-y: auto;
  }
  .item {
    background: #2b2d31;
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 6px;
    cursor: pointer;
    text-align: center;
  }
  .item:hover { border-color: #5865f2; }
  .item.selected { border-color: #5865f2; background: #35374a; }
  .item img {
    width: 100%;
    height: 70px;
    object-fit: contain;
    background: #111214;
    border-radius: 4px;
  }
  .item span {
    display: block;
    font-size: 11px;
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #actions {
    margin-top: 16px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  button {
    border: 0;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  #cancel { background: #4e5058; color: #fff; }
  #confirm { background: #5865f2; color: #fff; }
  #confirm:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <h1>Escolha uma tela ou janela para compartilhar</h1>
  <div id="grid"></div>
  <div id="actions">
    <button id="cancel">Cancelar</button>
    <button id="confirm" disabled>Compartilhar</button>
  </div>

<script>
  let selectedId = null;
  const grid = document.getElementById('grid');
  const confirmBtn = document.getElementById('confirm');

  window.pickerAPI.onSources((sources) => {
    grid.innerHTML = '';
    sources.forEach((s) => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `<img src="${s.thumbnail}"><span>${s.name}</span>`;
      el.addEventListener('click', () => {
        document.querySelectorAll('.item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
        selectedId = s.id;
        confirmBtn.disabled = false;
      });
      el.addEventListener('dblclick', () => {
        window.pickerAPI.choose(s.id);
      });
      grid.appendChild(el);
    });
  });

  confirmBtn.addEventListener('click', () => {
    if (selectedId) window.pickerAPI.choose(selectedId);
  });
  document.getElementById('cancel').addEventListener('click', () => {
    window.pickerAPI.cancel();
  });
</script>
</body>
</html>
